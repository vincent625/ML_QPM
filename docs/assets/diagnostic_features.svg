   <g id="text_27">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c45" transform="translate(239.598677 14.179478)">Top individual predictors in the total-read diagnostic model</text>
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; fill: #243c45" transform="translate(239.598677 29.783033)">Five physical-run-grouped Elastic Net outer folds · frozen permutation results</text>
   </g>
  </g>
  <g id="text_28">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #89918f" transform="translate(130.257812 462.480026)">Blue: RawTrace · purple: ChipDiagnostics · orange: AutoCal · gray: metadata/context. Intervals are exploratory across five outer folds.</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #89918f" transform="translate(130.906125 473.042432)">Importance is predictive dependence—not causal impact or reads lost. † Count/geometry health or loading interpretation is withheld.</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #89918f" transform="translate(247.678687 483.604838)">RawTrace uses rendered-image proxies—not calibrated signal amplitude or SNR.</text>
  </g>
